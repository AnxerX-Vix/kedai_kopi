<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan - Kopinang Aku</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="wadah kepala">
      <h1>Kopinang Aku</h1>
      <nav>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="pesan.html">Pesan</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wadah">
    <h2>Form Pemesanan</h2>
    <form action="pesan.html" method="get" class="form-pesan">
      <div class="grup-input">
        <label for="nama">Nama Pemesan:</label>
        <input type="text" id="nama" name="nama" required>
      </div>

      <div class="grup-input">
        <label for="whatsapp">Nomor WhatsApp:</label>
        <input type="tel" id="whatsapp" name="whatsapp" required>
      </div>

      <div class="grup-input">
        <label for="menu">Pilih Menu:</label>
        <select id="menu" name="menu">
          <option value="americano">Americano - Rp15.000</option>
          <option value="kopi_susu">Kopi Susu Gula Aren - Rp18.000</option>
          <option value="mocca">Mocca - Rp20.000</option>
          <option value="matcha">Matcha Latte - Rp20.000</option>
          <option value="cokelat">Es Coklat - Rp18.000</option>
          <option value="lychee_tea">Lychee Tea - Rp16.000</option>
        </select>
      </div>

      <div class="grup-input">
        <label for="jumlah">Jumlah:</label>
        <input type="number" id="jumlah" name="jumlah" min="1" max="10" required>
      </div>

      <div class="grup-input">
        <span class="label-grup">Cara Ambil:</span>
        <div class="pilihan-radio">
          <input type="radio" id="ambil" name="cara_ambil" value="ambil" required>
          <label for="ambil">Ambil di tempat</label>
        </div>
        <div class="pilihan-radio">
          <input type="radio" id="diantar" name="cara_ambil" value="diantar">
          <label for="diantar">Diantar</label>
        </div>
      </div>

      <div class="grup-input">
        <label for="catatan">Catatan:</label>
        <textarea id="catatan" name="catatan" rows="3"></textarea>
      </div>

      <button type="submit" class="tombol-kirim">Kirim</button>
    </form>
  </main>

  <footer>
    <div class="wadah">
      <p>Jl. Kenangan Bunda No. 17</p>
      <p>Buka setiap hari mulai jam 09.00 WIB</p>
    </div>
  </footer>
</body>
</html>
